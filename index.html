<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>秒殺！1ボタンアクション Tap Strike</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link rel="stylesheet" href="css/style.css?v=32.0.0">
</head>

<body>

    <div class="bg-animated"></div>

    <!-- ゲームプレイHUD (ヘッダー ＋ スタイリッシュポーズボタン) -->
    <div id="ui" style="display: none;">
        <div class="score-board" id="score">SCORE: 0</div>
        <div class="hp-board" id="hp">❤️❤️❤️</div>
        <div class="combo-board" id="combo">COMBO: 0</div>
        <button id="btn-pause" class="btn-pause" onclick="window.game.togglePause()" aria-label="一時停止">
            <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="1" width="4.5" height="16" rx="2" fill="#00f0ff"/>
                <rect x="10.5" y="1" width="4.5" height="16" rx="2" fill="#00f0ff"/>
            </svg>
        </button>
    </div>

    <!-- モーダル1: モード（難易度）選択画面 -->
    <div id="modal-mode-select" class="modal-box">
        <h1>TAP STRIKE</h1>
        <div class="btn-container" style="margin-top: 20px;">
            <button id="btn-mode-easy" class="btn-mode btn-mode-easy" onclick="window.game.showStageSelect('EASY')">
                <span>EASY</span>
            </button>
            <button id="btn-mode-normal" class="btn-mode btn-mode-normal" onclick="window.game.showStageSelect('NORMAL')">
                <span>NORMAL</span>
            </button>
            <button id="btn-mode-hard" class="btn-mode btn-mode-hard" onclick="window.game.showStageSelect('HARD')">
                <span>HARD</span>
            </button>
            <button id="btn-mode-funny" class="btn-mode btn-mode-funny" onclick="window.game.showStageSelect('FUNNY')">
                <span>FUNNY</span>
            </button>

            <!-- ボトムアクション行 (言語切り替えスイッチ ＋ キャラクター図鑑ボタン) -->
            <div class="menu-action-row">
                <div class="lang-switch-wrapper" title="Language Switch (JP / EN)">
                    <label class="lang-switch">
                        <input type="checkbox" id="lang-toggle-checkbox" onchange="i18n.toggleLanguage()">
                        <span class="lang-slider">
                            <span class="lang-txt-ja">JP</span>
                            <span class="lang-txt-en">EN</span>
                        </span>
                    </label>
                </div>

                <button class="btn-action btn-encylopedia" onclick="window.game.showCharacterList()" data-i18n="btn_encyclopedia">
                    キャラクター図鑑
                </button>
            </div>
        </div>
    </div>

    <!-- モーダル1.5: キャラクター図鑑画面 -->
    <div id="modal-character-list" class="modal-box" style="display: none;">
        <div style="text-align: left;">
            <button class="btn-back" onclick="window.game.showModeSelect()" data-i18n="btn_title_return">タイトルへ戻る</button>
        </div>
        <h1 class="diff-title" style="color: #00f0ff;" data-i18n="encyclopedia_title">CHARACTER ENCYCLOPEDIA</h1>
        <p class="subtitle" data-i18n="encyclopedia_subtitle">登場する全エネミーとノーツのコレクション</p>
        <div id="character-grid" class="character-grid">
            <div class="loading-text">図鑑読込中...</div>
        </div>
    </div>

    <!-- モーダル2: ステージ選択画面 -->
    <div id="modal-stage-select" class="modal-box" style="display: none;">
        <div style="text-align: left;">
            <button id="btn-stage-back" class="btn-back" onclick="window.game.showModeSelect()">モード選択に戻る</button>
        </div>
        <h1 id="selected-mode-title" class="diff-title">EASY</h1>
        <p class="subtitle">ステージを選択してスタート！</p>
        <div id="stage-list" class="btn-container">
            <div class="loading-text">読込中...</div>
        </div>
    </div>

    <!-- モーダル3: ゲームオーバー画面 -->
    <div id="modal-game-over" class="modal-box" style="display: none;">
        <h1 data-i18n="game_over_title">GAME OVER</h1>
        <p id="game-over-stage-name" class="game-over-stage-name"></p>
        <p id="final-score" class="game-over-score">SCORE: 0</p>
        <p id="high-score-notice" class="game-over-best">BEST SCORE: 0</p>
        <div class="btn-container" style="margin-top: 18px;">
            <button id="btn-retry" class="btn-action btn-retry" onclick="window.game.restartStage()">
                もう一度挑戦
            </button>
            <button id="btn-restart" class="btn-action" onclick="window.game.showStageSelect()" data-i18n="btn_stage_select">
                ステージ選択
            </button>
            <button id="btn-home" class="btn-action" onclick="window.game.showModeSelect()" data-i18n="btn_title_return">
                タイトルへ戻る
            </button>
        </div>
    </div>

    <!-- モーダル4: ポーズ(一時停止)画面 -->
    <div id="modal-pause" class="modal-box" style="display: none;">
        <h1 data-i18n="paused_title">PAUSED</h1>
        <p class="subtitle" style="margin-bottom: 20px;">一時停止中</p>
        <div class="btn-container">
            <button id="btn-resume" class="btn-action" onclick="window.game.togglePause()" style="background: linear-gradient(135deg, #00f0ff, #0077ff); color: #fff;" data-i18n="btn_resume">
                ゲーム再開
            </button>
            <button class="btn-action" onclick="window.game.restartStage()" data-i18n="btn_restart">
                最初からやり直す
            </button>
            <button class="btn-action" onclick="window.game.showStageSelect()" data-i18n="btn_stage_select">
                ステージ選択
            </button>
            <button class="btn-action" onclick="window.game.showModeSelect()" data-i18n="btn_title_return">
                タイトルへ戻る
            </button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- モジュールスクリプト -->
    <script src="js/i18n.js?v=90.0.0"></script>
    <script src="js/config.js?v=80.0.0"></script>
    <script src="js/audio.js?v=80.0.0"></script>
    <script src="js/loader.js?v=80.0.0"></script>
    <script src="js/patterns.js?v=80.0.0"></script>
    <script src="js/effects.js?v=80.0.0"></script>
    <script src="js/ui.js?v=80.0.0"></script>
    <script src="js/entities.js?v=80.0.0"></script>
    <script src="js/behaviors.js?v=80.0.0"></script>

    <!-- エネミーモジュール群 (1カテゴリ1ファイル・サウンドカプセル化) -->
    <script src="js/enemies/enemy.js?v=81.0.0"></script>
    <script src="js/enemies/geometric.js?v=81.0.0"></script>

    <!-- 猫ファミリー専用サブフォルダ (js/enemies/animals/cats/ オブジェクト指向基底継承) -->
    <script src="js/enemies/animals/cats/cat_base.js?v=83.0.0"></script>
    <script src="js/enemies/animals/cats/mike.js?v=83.0.0"></script>
    <script src="js/enemies/animals/cats/kijitora.js?v=83.0.0"></script>
    <script src="js/enemies/animals/cats/hachiware.js?v=83.0.0"></script>
    <script src="js/enemies/animals/dogs.js?v=81.0.0"></script>
    <script src="js/enemies/animals/chickens.js?v=81.0.0"></script>
    <script src="js/enemies/animals/bees.js?v=81.0.0"></script>
    <script src="js/enemies/animals/frogs.js?v=81.0.0"></script>
    <!-- ウミウシ専用サブフォルダ (js/enemies/animals/slugs/ オブジェクト指向基底継承) -->
    <script src="js/enemies/animals/slugs/sea_slug_base.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/blue_slug.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/jorunna_slug.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/pikachu_slug.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/strawberry_slug.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/cinderella_slug.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/glaucus_slug.js?v=86.0.0"></script>
    <script src="js/enemies/animals/slugs/mizore_slug.js?v=87.0.0"></script>
    <script src="js/enemies/animals/slugs/kompeito_slug.js?v=87.0.0"></script>

    <!-- 特殊アイテム・ギミック専用サブフォルダ (js/enemies/items/) -->
    <script src="js/enemies/items/heal.js?v=84.0.0"></script>
    <script src="js/enemies/items/bomb.js?v=84.0.0"></script>
    <script src="js/enemies/items/firework.js?v=84.0.0"></script>
    <script src="js/enemies/items/sakura_petal.js?v=88.0.0"></script>

    <!-- 寿司カテゴリ専用サブフォルダ (js/enemies/sushi/ オブジェクト指向基底継承) -->
    <script src="js/enemies/sushi/sushi_base.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/tuna.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/salmon.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/shrimp.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/egg.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/mackerel.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/octopus.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/squid.js?v=82.0.0"></script>
    <script src="js/enemies/sushi/kappa_roll.js?v=82.0.0"></script>
    <script src="js/enemies/enemy_factory.js?v=84.0.0"></script>

    <script src="js/game.js?v=81.0.0"></script>
</body>

</html>
