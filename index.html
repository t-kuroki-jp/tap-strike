<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>秒殺！1ボタンアクション Tap Strike</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #05070e;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            text-align: center;
        }

        /* --- 動きのある背景 --- */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(5, 7, 14, 0.9) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0, 240, 255, 0.3) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0, 240, 255, 0.3) 40px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: bgScroll var(--bg-scroll-speed, 3s) linear infinite;
            transition: background 0.5s ease;
        }

        @keyframes bgScroll {
            0% {
                background-position: 0 0, 0 0, 0 0;
            }

            100% {
                background-position: 0 0, 0 80px, 80px 0;
            }
        }

        canvas {
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            background: transparent;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
        }

        .hp-board {
            font-size: 18px;
            color: #ff0055;
            margin-top: 4px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff0055;
        }

        .combo-board {
            font-size: 16px;
            color: #ff007f;
            margin-top: 3px;
        }

        #start-screen,
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            width: 90%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(5, 7, 14, 0.88);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        #game-over {
            display: none;
        }

        h1 {
            font-size: 30px;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff;
            margin-bottom: 5px;
        }

        #game-over h1 {
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
        }

        p.subtitle {
            font-size: 14px;
            margin-bottom: 15px;
            color: #aaa;
        }

        .diff-section {
            margin-bottom: 15px;
            text-align: left;
        }

        .diff-title {
            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .diff-EASY { background: #00ff88; color: #000; }
        .diff-NORMAL { background: #00f0ff; color: #000; }
        .diff-HARD { background: #ff0055; color: #fff; }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .var-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .var-card:hover, .var-card:active {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            transform: scale(0.98);
        }

        .var-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .var-desc {
            font-size: 12px;
            color: #bbb;
            margin-top: 3px;
        }

        .var-stats {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        .var-score {
            font-size: 11px;
            color: #ffcc00;
            text-align: right;
        }

        .btn-action {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-normal {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 12px #00f0ff;
            margin-top: 10px;
        }

        .loading-text {
            font-size: 16px;
            color: #00f0ff;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <div class="bg-animated"></div>

    <div id="ui">
        <div class="score-board" id="score">SCORE: 0</div>
        <div class="hp-board" id="hp">❤️❤️❤️</div>
        <div class="combo-board" id="combo">COMBO: 0</div>
    </div>

    <div id="start-screen">
        <h1>TAP STRIKE</h1>
        <p class="subtitle">バリエーションを選択してスタート！</p>
        <div id="variation-list" class="btn-container">
            <div class="loading-text">バリエーション読込中...</div>
        </div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score" style="font-size: 18px; color: #fff; margin-bottom: 8px;">SCORE: 0</p>
        <p id="high-score-notice" style="font-size: 14px; color: #ffcc00; margin-bottom: 15px;"></p>
        <button class="btn-action btn-normal" onclick="showStartScreen()">TITLE BACK</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth, 500);
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- バリエーション＆敵マスタ動的読込システム ---
        let loadedVariations = [];
        let currentVariation = null;
        let enemyMaster = {};

        async function loadEnemiesMaster() {
            try {
                const res = await fetch(`enemies.json?t=${Date.now()}`);
                enemyMaster = await res.json();
            } catch (e) {
                console.error('Failed to load enemies.json', e);
            }
        }

        async function loadVariations() {
            await loadEnemiesMaster();
            try {
                const listRes = await fetch(`variations/list.json?t=${Date.now()}`);
                const filePaths = await listRes.json();

                loadedVariations = [];
                for (const path of filePaths) {
                    try {
                        const varRes = await fetch(`${path}?t=${Date.now()}`);
                        const varData = await varRes.json();
                        loadedVariations.push(varData);
                    } catch (e) {
                        console.error(`Failed to load variation at ${path}`, e);
                    }
                }
                renderVariationMenu();
            } catch (e) {
                console.error('Failed to load variations list', e);
                document.getElementById('variation-list').innerHTML = '<div class="loading-text" style="color:#ff0055">バリエーションの読込に失敗しました</div>';
            }
        }

        function renderVariationMenu() {
            const container = document.getElementById('variation-list');
            container.innerHTML = '';

            const diffs = ['EASY', 'NORMAL', 'HARD'];
            diffs.forEach(diff => {
                const items = loadedVariations.filter(v => v.difficulty === diff);
                if (items.length === 0) return;

                const sec = document.createElement('div');
                sec.className = 'diff-section';

                const title = document.createElement('div');
                title.className = `diff-title diff-${diff}`;
                title.innerText = `${diff} モード`;
                sec.appendChild(title);

                items.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'var-card';
                    const best = localStorage.getItem(`bestScore_${v.id}`) || 0;
                    const hpCount = v.player && v.player.maxHp ? v.player.maxHp : 1;

                    card.innerHTML = `
                        <div class="var-name">${v.name}</div>
                        <div class="var-desc">${v.description || ''}</div>
                        <div class="var-stats">
                            <span>❤️ HP: ${hpCount} | ⭕ リング径: ${v.gameplay?.targetRadius || 60}</span>
                            <span class="var-score">🏆 BEST: ${best}</span>
                        </div>
                    `;
                    card.onclick = () => startGameWithVariation(v);
                    sec.appendChild(card);
                });

                container.appendChild(sec);
            });
        }

        // --- 音声システム ---
        let audioCtx = null;
        let bgmInterval = null;
        let bgmStep = 0;
        let beatPulse = 0;
        let currentBgmAudio = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playMissSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function startBGM() {
            stopBGM();

            if (currentVariation && currentVariation.bgm) {
                currentBgmAudio = new Audio(currentVariation.bgm);
                currentBgmAudio.loop = true;
                currentBgmAudio.volume = 0.4;
                currentBgmAudio.play().catch(e => console.log('BGM Play error:', e));
            }

            bgmStep = 0;
            const spawnInterval = currentVariation ? (currentVariation.spawnRate || 187) : 187;

            bgmInterval = setInterval(() => {
                if (isGameOver || !isGameStarted) return;

                beatPulse = 5;

                if (bgmStep % 2 === 0 && Math.random() > 0.3) {
                    enemies.push(new Enemy());
                }

                bgmStep++;
            }, spawnInterval);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
            if (currentBgmAudio) {
                currentBgmAudio.pause();
                currentBgmAudio.currentTime = 0;
                currentBgmAudio = null;
            }
        }

        // --- ゲーム状態・パラメータ変数 ---
        let score = 0;
        let combo = 0;
        let isGameOver = false;
        let isGameStarted = false;
        let enemies = [];
        let particles = [];
        let shockwaves = [];
        let gameSpeed = 1.0;

        let ringPulse = 0;
        let ringColor = '#00f0ff';

        let lastTapTime = 0;
        let tapCooldown = 180;
        let missPenaltyTimer = 0;
        let hitWindow = 25;
        let speedIncrement = 0.008;
        let baseScore = 100;
        let particleCount = 12;

        const player = {
            x: 0,
            y: 0,
            radius: 20,
            targetRadius: 60,
            hp: 1,
            maxHp: 1,
            color: '#00f0ff'
        };

        function applyVariationParams(variation) {
            if (!variation) return;

            // Gameplay
            player.targetRadius = variation.gameplay?.targetRadius || 60;
            hitWindow = variation.gameplay?.hitWindow || 25;
            tapCooldown = variation.gameplay?.tapCooldown || 180;
            speedIncrement = variation.gameplay?.speedIncrement || 0.008;
            baseScore = variation.gameplay?.baseScore || 100;

            // Player
            player.maxHp = variation.player?.maxHp || 1;
            player.hp = player.maxHp;
            missPenaltyDuration = variation.player?.missPenaltyDuration || 18;

            // Visuals
            particleCount = variation.visuals?.particleCount || 12;
            const scrollSpeed = variation.visuals?.bgScrollSpeed || '3s';
            document.documentElement.style.setProperty('--bg-scroll-speed', scrollSpeed);

            // Theme
            const theme = variation.theme;
            if (theme) {
                const bgElem = document.querySelector('.bg-animated');
                if (bgElem) {
                    bgElem.style.background = `
                        radial-gradient(circle, ${theme.bgGlow || 'rgba(0, 240, 255, 0.25)'} 0%, rgba(5, 7, 14, 0.9) 100%),
                        repeating-linear-gradient(0deg, transparent, transparent 39px, ${theme.gridColor || 'rgba(0, 240, 255, 0.3)'} 40px),
                        repeating-linear-gradient(90deg, transparent, transparent 39px, ${theme.gridColor || 'rgba(0, 240, 255, 0.3)'} 40px)
                    `;
                }
                ringColor = theme.ringColor || '#00f0ff';
                player.color = theme.playerColor || '#00f0ff';
            }
            updateUI();
        }

        function pickWeightedEnemy(pool) {
            if (!pool || pool.length === 0) return { id: 'CHASER', weight: 1.0 };
            let totalWeight = pool.reduce((sum, item) => sum + (item.weight || 1), 0);
            let rand = Math.random() * totalWeight;
            for (let item of pool) {
                if (rand < (item.weight || 1)) return item;
                rand -= (item.weight || 1);
            }
            return pool[0];
        }

        class Enemy {
            constructor() {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(canvas.width, canvas.height) * 0.6;
                this.x = canvas.width / 2 + Math.cos(angle) * distance;
                this.y = canvas.height / 2 + Math.sin(angle) * distance;

                const pool = currentVariation ? currentVariation.enemyPool : [{ id: 'CHASER', weight: 1.0 }];
                const pickedItem = pickWeightedEnemy(pool);
                const masterData = enemyMaster[pickedItem.id] || {
                    name: 'クリムゾン・チェイサー', color: '#ff0055', shape: 'circle', speedRatio: 1.0, size: 12, behavior: 'straight'
                };

                this.id = pickedItem.id;
                this.name = masterData.name;
                this.color = masterData.color || '#ff0055';
                this.shape = masterData.shape || 'circle';
                this.behavior = masterData.behavior || 'straight';
                this.speed = (2.0 * (masterData.speedRatio || 1.0)) * gameSpeed;
                this.size = masterData.size || 12;
            }

            update() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const dx = centerX - this.x;
                const dy = centerY - this.y;
                const dist = Math.hypot(dx, dy);

                let currentSpeed = this.speed;
                if (this.behavior === 'feint' && dist < player.targetRadius + 60 && dist > player.targetRadius + 15) {
                    currentSpeed *= 0.3;
                }

                this.x += (dx / dist) * currentSpeed;
                this.y += (dy / dist) * currentSpeed;

                return dist;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                if (this.shape === 'square') {
                    ctx.rect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1.0;
                this.color = color || (Math.random() > 0.5 ? '#00f0ff' : '#ff007f');
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.alpha = 0.8;
                this.color = color;
            }

            update() {
                this.radius += 5;
                this.alpha -= 0.05;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function startGameWithVariation(variation) {
            initAudio();
            currentVariation = variation;
            applyVariationParams(variation);
            isGameStarted = true;
            document.getElementById('start-screen').style.display = 'none';
            resetGame();
        }

        function showStartScreen() {
            isGameStarted = false;
            stopBGM();
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
            renderVariationMenu();
        }

        function handleInput(e) {
            if (!isGameStarted || isGameOver) return;
            if (e && e.preventDefault) e.preventDefault();

            const now = Date.now();
            if (now - lastTapTime < tapCooldown || missPenaltyTimer > 0) return;
            lastTapTime = now;

            const rect = canvas.getBoundingClientRect();
            let touchX = canvas.width / 2;
            let touchY = canvas.height / 2;

            if (e.touches && e.touches.length > 0) {
                touchX = e.touches[0].clientX - rect.left;
                touchY = e.touches[0].clientY - rect.top;
            } else if (e.clientX !== undefined) {
                touchX = e.clientX - rect.left;
                touchY = e.clientY - rect.top;
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            let hit = false;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dist = Math.hypot(centerX - enemy.x, centerY - enemy.y);

                if (Math.abs(dist - player.targetRadius) < hitWindow) {
                    hit = true;
                    createParticles(enemy.x, enemy.y, enemy.color);
                    enemies.splice(i, 1);
                    combo++;
                    score += baseScore * combo;
                    gameSpeed += speedIncrement;
                    break;
                }
            }

            if (hit) {
                playHitSound();
                ringPulse = 15;
                ringColor = currentVariation && currentVariation.theme ? currentVariation.theme.ringColor : '#00f0ff';
                shockwaves.push(new Shockwave(touchX, touchY, ringColor));
            } else {
                playMissSound();
                combo = 0;
                ringPulse = 8;
                ringColor = '#ff0055';
                missPenaltyTimer = 18;
                shockwaves.push(new Shockwave(touchX, touchY, '#ff0055'));
            }

            updateUI();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = `SCORE: ${score}`;
            document.getElementById('combo').innerText = `COMBO: ${combo}x`;
            const hpStr = '❤️'.repeat(Math.max(0, player.hp));
            document.getElementById('hp').innerText = hpStr || '💀';
        }

        function gameOver() {
            isGameOver = true;
            stopBGM();
            playGameOverSound();

            let noticeText = '';
            if (currentVariation) {
                const storageKey = `bestScore_${currentVariation.id}`;
                const prevBest = parseInt(localStorage.getItem(storageKey) || '0', 10);
                if (score > prevBest) {
                    localStorage.setItem(storageKey, score.toString());
                    noticeText = '🎉 NEW RECORD!';
                } else {
                    noticeText = `BEST SCORE: ${prevBest}`;
                }
            }

            document.getElementById('final-score').innerText = `SCORE: ${score} (${currentVariation ? currentVariation.name : ''})`;
            document.getElementById('high-score-notice').innerText = noticeText;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            score = 0;
            combo = 0;
            gameSpeed = 1.0;
            enemies = [];
            particles = [];
            shockwaves = [];
            ringPulse = 0;
            ringColor = currentVariation && currentVariation.theme ? currentVariation.theme.ringColor : '#00f0ff';
            missPenaltyTimer = 0;
            lastTapTime = 0;
            isGameOver = false;
            if (currentVariation) {
                applyVariationParams(currentVariation);
            }
            document.getElementById('game-over').style.display = 'none';
            startBGM();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!isGameStarted || isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            if (beatPulse > 0) beatPulse *= 0.85;

            if (missPenaltyTimer > 0) {
                missPenaltyTimer--;
                ringColor = '#ff0055';
            } else if (ringPulse === 0) {
                ringColor = currentVariation && currentVariation.theme ? currentVariation.theme.ringColor : '#00f0ff';
            }

            if (ringPulse > 0) {
                ringPulse *= 0.85;
                if (ringPulse < 0.1) ringPulse = 0;
            }

            // 自機
            ctx.save();
            ctx.fillStyle = missPenaltyTimer > 0 ? '#ff0055' : player.color;
            ctx.shadowColor = missPenaltyTimer > 0 ? '#ff0055' : player.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(centerX, centerY, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // リング
            const currentRadius = player.targetRadius + ringPulse + beatPulse;
            ctx.strokeStyle = ringColor;
            ctx.lineWidth = 2 + (ringPulse / 3);
            ctx.shadowColor = ringColor;
            ctx.shadowBlur = 10 + ringPulse * 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 敵更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dist = enemy.update();
                enemy.draw();

                if (dist <= player.radius) {
                    createParticles(enemy.x, enemy.y, '#ff0055');
                    enemies.splice(i, 1);
                    player.hp--;
                    updateUI();
                    playMissSound();

                    if (player.hp <= 0) {
                        gameOver();
                        return;
                    }
                }
            }

            // エフェクト更新
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.update();
                sw.draw();
                if (sw.alpha <= 0) shockwaves.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON' && !e.target.closest('#start-screen') && !e.target.closest('#game-over')) {
                handleInput(e);
            }
        });

        // 初期化
        loadVariations();
        updateUI();
    </script>
</body>

</html>
