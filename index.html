<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>秒殺！1ボタンアクション プロトタイプ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #05070e;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            text-align: center;
        }

        /* --- 動きのある背景（くっきり主張版） --- */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(5, 7, 14, 0.9) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0, 240, 255, 0.3) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0, 240, 255, 0.3) 40px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: bgScroll 3s linear infinite;
        }

        @keyframes bgScroll {
            0% {
                background-position: 0 0, 0 0, 0 0;
            }

            100% {
                background-position: 0 0, 0 80px, 80px 0;
            }
        }

        canvas {
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            background: transparent;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
        }

        .combo-board {
            font-size: 18px;
            color: #ff007f;
            margin-top: 5px;
        }

        #start-screen,
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            width: 80%;
        }

        #game-over {
            display: none;
        }

        h1 {
            font-size: 32px;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff;
            margin-bottom: 10px;
        }

        #game-over h1 {
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #aaa;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-action {
            width: 100%;
            max-width: 240px;
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-easy {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 12px #00ff88;
        }

        .btn-normal {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 12px #00f0ff;
        }

        .btn-hard {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 12px #ff0055;
        }

        .btn-download {
            background: #333;
            color: #fff;
            font-size: 14px;
            margin-top: 15px;
            border: 1px solid #666;
        }

        .btn-action:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="bg-animated"></div>

    <div id="ui">
        <div class="score-board" id="score">SCORE: 0</div>
        <div class="combo-board" id="combo">COMBO: 0</div>
    </div>

    <div id="start-screen">
        <h1>1-BUTTON ACTION</h1>
        <p>難易度を選んでスタート！</p>
        <div class="btn-container">
            <button class="btn-action btn-easy" onclick="startGame('EASY')">EASY（かんたん）</button>
            <button class="btn-action btn-normal" onclick="startGame('NORMAL')">NORMAL（ふつう）</button>
            <button class="btn-action btn-hard" onclick="startGame('HARD')">HARD（むずかしい）</button>
            <button class="btn-action btn-download" onclick="downloadSelf()">📥 index.htmlを保存</button>
        </div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score">SCORE: 0</p>
        <button class="btn-action btn-normal" onclick="showStartScreen()">TITLE BACK</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = Math.min(window.innerWidth, 500);
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ダウンロード機能 ---
        function downloadSelf() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // --- 音声＆フルBGM合成システム ---
        let audioCtx = null;
        let bgmInterval = null;
        let bgmStep = 0;
        let beatPulse = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playMissSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playGameOverSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            bgmStep = 0;

            const bassNotes = [110, 110, 130, 110, 146, 130, 110, 98];
            const leadNotes = [440, 0, 523, 587, 659, 0, 587, 523, 440, 523, 659, 783, 659, 587, 523, 440];

            let bpmTempo = 187;
            if (currentDifficulty === 'EASY') bpmTempo = 220;
            if (currentDifficulty === 'HARD') bpmTempo = 150;

            bgmInterval = setInterval(() => {
                if (isGameOver || !isGameStarted || !audioCtx) return;

                const bassFreq = bassNotes[bgmStep % bassNotes.length];
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bOsc.type = 'sawtooth';
                bOsc.frequency.setValueAtTime(bassFreq, audioCtx.currentTime);
                bGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                bGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                bOsc.connect(bGain);
                bGain.connect(audioCtx.destination);
                bOsc.start();
                bOsc.stop(audioCtx.currentTime + 0.15);

                const leadFreq = leadNotes[bgmStep % leadNotes.length];
                if (leadFreq > 0) {
                    const lOsc = audioCtx.createOscillator();
                    const lGain = audioCtx.createGain();
                    lOsc.type = 'square';
                    lOsc.frequency.setValueAtTime(leadFreq, audioCtx.currentTime);
                    lGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    lGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    lOsc.connect(lGain);
                    lGain.connect(audioCtx.destination);
                    lOsc.start();
                    lOsc.stop(audioCtx.currentTime + 0.12);
                }

                beatPulse = 5;

                if (bgmStep % 2 === 0 && Math.random() > 0.3) {
                    enemies.push(new Enemy());
                }

                bgmStep++;
            }, bpmTempo);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // --- ゲーム状態変数 ---
        let score = 0;
        let combo = 0;
        let isGameOver = false;
        let isGameStarted = false;
        let currentDifficulty = 'NORMAL';
        let enemies = [];
        let particles = [];
        let shockwaves = [];
        let gameSpeed = 1.0;

        let ringPulse = 0;
        let ringColor = '#00f0ff';

        let lastTapTime = 0;
        const TAP_COOLDOWN = 180;
        let missPenaltyTimer = 0;

        const player = {
            x: 0,
            y: 0,
            radius: 20,
            targetRadius: 60,
        };

        class Enemy {
            constructor() {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(canvas.width, canvas.height) * 0.6;
                this.x = canvas.width / 2 + Math.cos(angle) * distance;
                this.y = canvas.height / 2 + Math.sin(angle) * distance;

                const rand = Math.random();

                if (currentDifficulty === 'EASY') {
                    this.type = 'NORMAL';
                    this.color = '#ff0055';
                    this.speed = (1.5 + Math.random() * 0.3) * gameSpeed;
                    this.size = 12;
                } else if (currentDifficulty === 'NORMAL') {
                    if (rand < 0.75) {
                        this.type = 'NORMAL';
                        this.color = '#ff0055';
                        this.speed = (2.0 + Math.random() * 0.4) * gameSpeed;
                        this.size = 12;
                    } else {
                        this.type = 'FAST';
                        this.color = '#ffcc00';
                        this.speed = (3.2 + Math.random() * 0.4) * gameSpeed;
                        this.size = 9;
                    }
                } else {
                    if (rand < 0.5) {
                        this.type = 'NORMAL';
                        this.color = '#ff0055';
                        this.speed = (2.5 + Math.random() * 0.5) * gameSpeed;
                        this.size = 12;
                    } else if (rand < 0.8) {
                        this.type = 'FAST';
                        this.color = '#ffcc00';
                        this.speed = (4.0 + Math.random() * 0.5) * gameSpeed;
                        this.size = 9;
                    } else {
                        this.type = 'FEINT';
                        this.color = '#aa00ff';
                        this.speed = (3.0 + Math.random() * 0.5) * gameSpeed;
                        this.size = 13;
                    }
                }
            }

            update() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const dx = centerX - this.x;
                const dy = centerY - this.y;
                const dist = Math.hypot(dx, dy);

                let currentSpeed = this.speed;
                if (this.type === 'FEINT' && dist < player.targetRadius + 60 && dist > player.targetRadius + 15) {
                    currentSpeed *= 0.3;
                }

                this.x += (dx / dist) * currentSpeed;
                this.y += (dy / dist) * currentSpeed;

                return dist;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                if (this.type === 'FEINT') {
                    ctx.rect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1.0;
                this.color = color || (Math.random() > 0.5 ? '#00f0ff' : '#ff007f');
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.alpha = 0.8;
                this.color = color;
            }

            update() {
                this.radius += 5;
                this.alpha -= 0.05;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function startGame(diff) {
            initAudio();
            currentDifficulty = diff;
            isGameStarted = true;
            document.getElementById('start-screen').style.display = 'none';
            resetGame();
        }

        function showStartScreen() {
            isGameStarted = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('start-screen').style.display = 'block';
        }

        function handleInput(e) {
            if (!isGameStarted || isGameOver) return;
            if (e && e.preventDefault) e.preventDefault();

            const now = Date.now();
            if (now - lastTapTime < TAP_COOLDOWN || missPenaltyTimer > 0) return;
            lastTapTime = now;

            const rect = canvas.getBoundingClientRect();
            let touchX = canvas.width / 2;
            let touchY = canvas.height / 2;

            if (e.touches && e.touches.length > 0) {
                touchX = e.touches[0].clientX - rect.left;
                touchY = e.touches[0].clientY - rect.top;
            } else if (e.clientX !== undefined) {
                touchX = e.clientX - rect.left;
                touchY = e.clientY - rect.top;
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            let hit = false;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dist = Math.hypot(centerX - enemy.x, centerY - enemy.y);

                if (Math.abs(dist - player.targetRadius) < 25) {
                    hit = true;
                    createParticles(enemy.x, enemy.y, enemy.color);
                    enemies.splice(i, 1);
                    combo++;
                    score += 100 * combo;
                    gameSpeed += 0.008;
                    break;
                }
            }

            if (hit) {
                playHitSound();
                ringPulse = 15;
                ringColor = '#00f0ff';
                shockwaves.push(new Shockwave(touchX, touchY, '#00f0ff'));
            } else {
                playMissSound();
                combo = 0;
                ringPulse = 8;
                ringColor = '#ff0055';
                missPenaltyTimer = 18;
                shockwaves.push(new Shockwave(touchX, touchY, '#ff0055'));
            }

            updateUI();
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = `SCORE: ${score}`;
            document.getElementById('combo').innerText = `COMBO: ${combo}x`;
        }

        function gameOver() {
            isGameOver = true;
            stopBGM();
            playGameOverSound();
            document.getElementById('final-score').innerText = `FINAL SCORE: ${score} (${currentDifficulty})`;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            score = 0;
            combo = 0;
            gameSpeed = 1.0;
            enemies = [];
            particles = [];
            shockwaves = [];
            ringPulse = 0;
            ringColor = '#00f0ff';
            missPenaltyTimer = 0;
            lastTapTime = 0;
            isGameOver = false;
            document.getElementById('game-over').style.display = 'none';
            startBGM();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!isGameStarted || isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            if (beatPulse > 0) beatPulse *= 0.85;

            if (missPenaltyTimer > 0) {
                missPenaltyTimer--;
                ringColor = '#ff0055';
            } else if (ringPulse === 0) {
                ringColor = '#00f0ff';
            }

            if (ringPulse > 0) {
                ringPulse *= 0.85;
                if (ringPulse < 0.1) ringPulse = 0;
            }

            // 自機
            ctx.save();
            ctx.fillStyle = missPenaltyTimer > 0 ? '#ff0055' : '#00f0ff';
            ctx.shadowColor = missPenaltyTimer > 0 ? '#ff0055' : '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(centerX, centerY, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // リング
            const currentRadius = player.targetRadius + ringPulse + beatPulse;
            ctx.strokeStyle = ringColor;
            ctx.lineWidth = 2 + (ringPulse / 3);
            ctx.shadowColor = ringColor;
            ctx.shadowBlur = 10 + ringPulse * 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 敵更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dist = enemy.update();
                enemy.draw();

                if (dist <= player.radius) {
                    gameOver();
                    return;
                }
            }

            // エフェクト更新
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.update();
                sw.draw();
                if (sw.alpha <= 0) shockwaves.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                handleInput(e);
            }
        });

        updateUI();
    </script>
</body>

</html>
