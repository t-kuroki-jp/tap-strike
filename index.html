<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>秒殺！1ボタンアクション Tap Strike</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link rel="stylesheet" href="css/style.css?v=20.0.0">
</head>

<body>

    <div class="bg-animated"></div>

    <!-- ゲームプレイHUD (ヘッダー) -->
    <div id="ui" style="display: none;">
        <div class="score-board" id="score">SCORE: 0</div>
        <div class="hp-board" id="hp">❤️❤️❤️</div>
        <div class="combo-board" id="combo">COMBO: 0</div>
    </div>

    <!-- モーダル1: モード（難易度）選択画面 -->
    <div id="modal-mode-select" class="modal-box">
        <h1>TAP STRIKE</h1>
        <div class="btn-container" style="margin-top: 25px;">
            <button id="btn-mode-easy" class="btn-mode btn-mode-easy" onclick="window.game.showStageSelect('EASY')">
                <span>EASY</span>
            </button>
            <button id="btn-mode-normal" class="btn-mode btn-mode-normal" onclick="window.game.showStageSelect('NORMAL')">
                <span>NORMAL</span>
            </button>
            <button id="btn-mode-hard" class="btn-mode btn-mode-hard" onclick="window.game.showStageSelect('HARD')">
                <span>HARD</span>
            </button>
            <button id="btn-mode-funny" class="btn-mode btn-mode-funny" onclick="window.game.showStageSelect('FUNNY')">
                <span>FUNNY</span>
            </button>
        </div>
    </div>

    <!-- モーダル2: ステージ選択画面 -->
    <div id="modal-stage-select" class="modal-box" style="display: none;">
        <div style="text-align: left;">
            <button id="btn-stage-back" class="btn-back" onclick="window.game.showModeSelect()">⬅ モード選択に戻る</button>
        </div>
        <h1 id="selected-mode-title" class="diff-title">EASY</h1>
        <p class="subtitle">ステージを選択してスタート！</p>
        <div id="stage-list" class="btn-container">
            <div class="loading-text">読込中...</div>
        </div>
    </div>

    <!-- モーダル3: ゲームオーバー画面 (爆速リトライ付き) -->
    <div id="modal-game-over" class="modal-box" style="display: none;">
        <h1>GAME OVER</h1>
        <p id="final-score" style="font-size: 18px; color: #fff; margin-bottom: 8px;">SCORE: 0</p>
        <p id="high-score-notice" style="font-size: 14px; color: #ffcc00; margin-bottom: 15px;"></p>
        <div class="btn-container" style="margin-top: 15px;">
            <button id="btn-retry" class="btn-action btn-retry" onclick="window.game.restartStage()" style="background: linear-gradient(135deg, #00f0ff, #0077ff);">
                🔄 もう一度挑戦
            </button>
            <button id="btn-restart" class="btn-action" onclick="window.game.showStageSelect()">
                📋 ステージ選択
            </button>
            <button id="btn-home" class="btn-action" onclick="window.game.showModeSelect()">
                🏠 タイトルへ戻る
            </button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- モジュールスクリプト -->
    <script src="js/audio.js?v=13.1.1"></script>
    <script src="js/loader.js?v=13.1.1"></script>
    <script src="js/entities.js?v=13.1.1"></script>

    <!-- エネミーモジュール群 (1敵1ファイル・サウンドカプセル化) -->
    <script src="js/enemies/enemy.js?v=13.1.1"></script>
    <script src="js/enemies/chaser.js?v=13.1.1"></script>
    <script src="js/enemies/speeder.js?v=13.1.1"></script>
    <script src="js/enemies/glitch.js?v=13.1.1"></script>
    <script src="js/enemies/curve.js?v=13.1.1"></script>
    <script src="js/enemies/shield.js?v=13.1.1"></script>
    <script src="js/enemies/big_boss.js?v=13.1.1"></script>
    <script src="js/enemies/heal.js?v=13.1.1"></script>
    <script src="js/enemies/dont_tap.js?v=13.1.1"></script>
    <script src="js/enemies/chicken.js?v=13.1.1"></script>
    <script src="js/enemies/cat.js?v=13.1.1"></script>
    <script src="js/enemies/sushi.js?v=13.1.1"></script>
    <script src="js/enemies/bomb.js?v=13.1.1"></script>
    <script src="js/enemies/firework.js?v=13.1.1"></script>
    <script src="js/enemies/enemy_factory.js?v=13.1.1"></script>

    <script src="js/game.js?v=13.1.1"></script>
</body>

</html>
