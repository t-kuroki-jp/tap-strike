<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>秒殺！1ボタンアクション Tap Strike</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="bg-animated"></div>

    <div id="ui">
        <div class="score-board" id="score">SCORE: 0</div>
        <div class="hp-board" id="hp">❤️❤️❤️</div>
        <div class="combo-board" id="combo">COMBO: 0</div>
    </div>

    <div id="start-screen">
        <h1>TAP STRIKE</h1>
        <p class="subtitle">バリエーションを選択してスタート！</p>
        <div id="variation-list" class="btn-container">
            <div class="loading-text">バリエーション読込中...</div>
        </div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score" style="font-size: 18px; color: #fff; margin-bottom: 8px;">SCORE: 0</p>
        <p id="high-score-notice" style="font-size: 14px; color: #ffcc00; margin-bottom: 15px;"></p>
        <button class="btn-action btn-normal" onclick="game.showStartScreen()">TITLE BACK</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- モジュールスクリプト -->
    <script src="js/audio.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
